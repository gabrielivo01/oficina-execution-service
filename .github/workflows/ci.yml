name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci-quality:
    name: CI quality and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Unitários, contrato e contexto com H2 (sem Docker). Os *IT ficam no job "integracao".
      - name: Unit tests and quality checks
        run: ./mvnw -q clean verify

      - name: SonarCloud analysis and quality gate
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true

      - name: Build Docker image
        run: docker build -t oficina-execution-service:ci-${{ github.sha }} .

  integracao:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Perfil integracao (failsafe, *IT); o runner do GitHub tem Docker.
      - name: Integration tests
        run: ./mvnw -q verify -Pintegracao
